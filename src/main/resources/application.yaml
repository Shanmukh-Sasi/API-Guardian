server:
  port: 9090
spring:
  application:
    name: API Guardian
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: jdbc:mysql://localhost:3306/apiguardian
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

